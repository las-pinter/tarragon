name: Package Smoke Test

on:
  pull_request:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: smoke-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  import-smoke:
    # Cheap pre-gate: run only on pull requests.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv, Python 3.12, and dependencies
        uses: ./.github/actions/setup-tarragon
        with:
          python-version: "3.12"

      - name: Install Qt system dependencies
        uses: ./.github/actions/install-qt

      - name: Run import smoke tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          uv run python -c "import tarragon; print('tarragon OK')"
          uv run python -c "import tarragon.main; print('tarragon.main OK')"

  nuitka-smoke:
    # Cheap raw-compile pre-gate: run only on pull requests.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv, Python 3.12, and dependencies (build extra)
        uses: ./.github/actions/setup-tarragon
        with:
          python-version: "3.12"
          extra: true

      - name: Install Qt system dependencies
        uses: ./.github/actions/install-qt

      # NOTE: this repo is src-layout — the entry point is src/tarragon/main.py,
      # not tarragon/main.py.
      - name: Attempt minimal Nuitka compilation
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          uv run python -m nuitka \
            --onefile \
            --enable-plugin=pyside6 \
            --output-filename=tarragon-smoke.bin \
            --remove-output \
            src/tarragon/main.py

  # Real packaging build: runs the actual scripts/package_nuitka.py and then
  # launches the produced onefile binary to prove it works end-to-end.
  # Triggered on push to dev and workflow_dispatch (too expensive for PRs).
  nuitka-real:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv, Python 3.12, and dependencies (build extra)
        uses: ./.github/actions/setup-tarragon
        with:
          python-version: "3.12"
          extra: true

      - name: Install Qt system dependencies
        uses: ./.github/actions/install-qt

      - name: Build real Nuitka binary (scripts/package_nuitka.py)
        run: uv run python scripts/package_nuitka.py

      # Deterministic binary proof: the onefile binary must print a version and
      # exit 0. No explicit step timeout — Nuitka onefile extracts to a temp dir
      # on first launch, so startup latency is normal and expected.
      - name: Launch packaged binary and assert version
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -euo pipefail
          output="$(./dist/tarragon --version)"
          echo "binary --version output: $output"
          if [ -z "$output" ]; then
            echo "ERROR: packaged binary produced no version output" >&2
            exit 1
          fi
          case "$output" in
            *tarragon*) ;;
            *)
              echo "ERROR: version output does not look like a tarragon version: $output" >&2
              exit 1
              ;;
          esac
