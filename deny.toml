[advisories]
version = 2
yanked = "deny"
# The `zip` reader stays on 8.6.0 by a version pin. All three advisories cover
# the `extract` helpers, which copy archive entries onto the file system. The
# render crate only reads member bytes by name, so it never calls those helpers.
# The `=8.6.0` pin in `Cargo.toml` holds `zip` on 8.x. Move the pin to 9.x and delete these three ignores in the same change.
# Pin: `zip = "=8.6.0"` in the workspace `Cargo.toml`.
ignore = [
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
