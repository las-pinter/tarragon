[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"

[workspace.dependencies]
# Internal crates. The `version` key stops `cargo deny` from reading a bare
# path dependency as a wildcard. `tarragon-db` depends on `tarragon-core`
# only (Q16).
tarragon-core = { path = "crates/tarragon-core", version = "0.1.0" }
# Q8: egui/eframe 0.36.2. One pin, shared by every crate. tarragon-ui uses
# egui only and never eframe (Q8, Q16).
#
# Default fonts are off. The `epaint_default_fonts` crate carries the
# `OFL-1.1` and `Ubuntu-font-1.0` licenses, which are off the Q7 allowlist.
# The app must ship a font that passes the allowlist. The spike loads a system
# font at run time (see `examples/grid_spike.rs`).
egui = { version = "=0.36.2", default-features = false }
# Q19 names rayon for CPU-bound work. The grid spike uses a 4-thread pool as
# the Q10 four-core pin.
rayon = "1.11"
# Shared error types. `tarragon-core` owns the error enums; the other crates
# depend on them through core (Q16).
thiserror = "2"
# Q21: SQLite access uses `rusqlite` 0.40 with the `bundled` feature. The
# bundled SQLite keeps the build self-contained. `tarragon-db` is the only
# crate that links SQLite (Q16).
rusqlite = { version = "0.40", features = ["bundled"] }
# Q28: settings values store as JSON text, and the hidden `window_state` key
# holds a JSON blob. Only `tarragon-db` parses them.
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
