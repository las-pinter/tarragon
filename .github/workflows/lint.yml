name: Lint

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: lint-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies (uv sync, dev group)
        run: uv sync

      # Runs ruff check, ruff format --check, mypy, and the hygiene hooks
      # (trailing-whitespace, end-of-file-fixer) from .pre-commit-config.yaml
      # in one pass — this is the single source of truth for lint/type
      # checks, run once rather than duplicated across ci.yml's os/python
      # matrix.
      - name: Pre-commit validation (all hooks)
        run: uv run pre-commit run --all-files
