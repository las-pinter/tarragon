# Local quality-gate hooks. They run the four gates only.
# A commit runs these hooks without --no-verify.
repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt --check
        entry: cargo fmt --check
        language: system
        pass_filenames: false
        always_run: true
      - id: cargo-clippy
        name: cargo clippy --all-targets -- -D warnings
        entry: cargo clippy --all-targets -- -D warnings
        language: system
        pass_filenames: false
        always_run: true
      - id: cargo-nextest
        name: cargo nextest run (cargo test when nextest is absent)
        entry: sh -c 'if cargo nextest --version >/dev/null 2>&1; then cargo nextest run; else cargo test; fi'
        language: system
        pass_filenames: false
        always_run: true
      - id: cargo-deny
        name: cargo deny check
        entry: cargo deny check
        language: system
        pass_filenames: false
        always_run: true
