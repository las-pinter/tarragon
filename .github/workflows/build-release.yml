name: Build Release Binaries

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/test.yml
    with:
      python-versions: '["3.12","3.13"]'
      oses: '["ubuntu-latest","windows-latest"]'

  build:
    needs: test
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            binary-name: tarragon
            asset-os: linux
          - os: windows-latest
            binary-name: tarragon.exe
            asset-os: windows
          - os: macos-latest
            binary-name: tarragon
            asset-os: macos

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - name: Set up uv, Python 3.12, and dependencies
        uses: ./.github/actions/setup-tarragon
        with:
          python-version: "3.12"
          extra: true
      - name: Install Qt system dependencies
        uses: ./.github/actions/install-qt
      - name: Build binary
        run: uv run python scripts/package_nuitka.py
      - name: Assemble portable package
        shell: bash
        run: |
          set -e
          PKG_NAME="tarragon-${{ github.event.release.tag_name }}-${{ matrix.asset-os }}-portable"
          PKG_DIR="dist/$PKG_NAME"
          mkdir -p "$PKG_DIR/data"
          mv "dist/${{ matrix.binary-name }}" "$PKG_DIR/${{ matrix.binary-name }}"
          echo "PKG_NAME=$PKG_NAME" >> "$GITHUB_ENV"
      - name: Zip portable package
        shell: bash
        run: |
          cd dist
          if [ "$RUNNER_OS" == "Windows" ]; then
            powershell -Command "Compress-Archive -Path '${{ env.PKG_NAME }}' -DestinationPath '${{ env.PKG_NAME }}.zip'"
          else
            zip -r "${{ env.PKG_NAME }}.zip" "${{ env.PKG_NAME }}"
          fi
      - name: Generate checksum
        shell: bash
        run: |
          cd dist
          if [ "$RUNNER_OS" == "macOS" ]; then
            shasum -a 256 "${{ env.PKG_NAME }}.zip" > "${{ env.PKG_NAME }}.zip.sha256"
          else
            sha256sum "${{ env.PKG_NAME }}.zip" > "${{ env.PKG_NAME }}.zip.sha256"
          fi
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/${{ env.PKG_NAME }}.zip
            dist/${{ env.PKG_NAME }}.zip.sha256
