repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff
        args: [--fix, --no-cache]
      - id: ruff-format
        args: [--no-cache]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: mypy
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true
        args: ["--config-file=pyproject.toml", "src/tarragon"]

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: uv run pytest -n auto tests/ -q
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
