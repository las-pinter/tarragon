[package]
name = "tarragon-app"
description = "Binary entry point that wires the tarragon crates together."
version.workspace = true
edition.workspace = true
publish = false
license.workspace = true

[[bin]]
name = "tarragon"
path = "src/main.rs"

[dependencies]
crossbeam-channel = { workspace = true }
eframe = { workspace = true }
# The pipeline decodes cached tier files, so it needs the cache codecs.
image = { workspace = true, features = ["jpeg", "png"] }
tarragon-cache = { workspace = true }
tarragon-core = { workspace = true }
tarragon-db = { workspace = true }
tarragon-render = { workspace = true }
tarragon-scan = { workspace = true }
tarragon-ui = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-log = { workspace = true }
tracing-subscriber = { workspace = true }
# Only to match the event loop errors of eframe.
winit = { workspace = true }

[dev-dependencies]
egui_dock.workspace = true
log.workspace = true

[lints]
workspace = true
