[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"

[workspace.dependencies]
# Internal crates. The `version` key stops `cargo deny` from reading a bare
# path dependency as a wildcard. `tarragon-db` depends on `tarragon-core`
# only.
tarragon-core = { path = "crates/tarragon-core", version = "0.1.0" }
# The interface reads the stored window state in its tests today. The app
# crate owns the production wiring.
tarragon-db = { path = "crates/tarragon-db", version = "0.1.0" }
tarragon-ui = { path = "crates/tarragon-ui", version = "0.1.0" }
# egui/eframe 0.36.2. One pin, shared by every crate. tarragon-ui uses
# egui only and never eframe.
#
# Default fonts are off. The `epaint_default_fonts` crate carries the
# `OFL-1.1` and `Ubuntu-font-1.0` licenses, which are off the allowlist.
# The app must ship a font that passes the allowlist. `tarragon-ui` vendors
# the Roboto family and installs it in every target, examples included.
egui = { version = "=0.36.2", default-features = false }
# The GUI stack spike (an app example) uses eframe 0.36.2 and egui_dock 0.21.
# Both renderers and both Linux window backends are on, so one binary picks
# the renderer at run time. Default features are off: `default_fonts` would
# bring the OFL-1.1 and Ubuntu-font-1.0 fonts. Only dev-dependencies use them.
eframe = { version = "=0.36.2", default-features = false, features = ["glow", "wgpu", "x11", "wayland"] }
egui_dock = "=0.21.1"
# rayon handles CPU-bound work. The grid example caps its pool at four threads.
rayon = "1.11"
# Shared error types. `tarragon-core` owns the error enums; the other crates
# depend on them through core.
thiserror = "2"
# SQLite access uses `rusqlite` 0.40 with the `bundled` feature. The
# bundled SQLite keeps the build self-contained. `tarragon-db` is the only
# crate that links SQLite.
rusqlite = { version = "0.40", features = ["bundled"] }
# Settings values store as JSON text, and the hidden `window_state` key
# holds a JSON blob. Only `tarragon-db` parses them.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# PNG decoding for the golden image tests. One pin, shared with
# `tarragon-cache` and `tarragon-render`. Each crate turns on only its codecs.
image = { version = "=0.25.10", default-features = false }
# Krita `.kra` documents are ZIP archives. Real Krita archives may compress
# their members, so the reader enables the `flate2` deflate backend. The other
# features stay off so the dependency tree stays small. `deflate-zopfli` stays
# off: zopfli only compresses on write and the renderer only reads.
# The `=8.6.0` pin keeps `zip` on 8.x. Move the pin to 9.x and delete the
# three advisory ignores in `deny.toml` in the same change.
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# Dependencies build optimized in dev and test, so image decoding and egui
# code do not run at opt-level 0. The workspace crates keep fast rebuilds.
[profile.dev.package."*"]
opt-level = 2

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
